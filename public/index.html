<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CODE-CATALYST</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link
rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="background">

<div class="circle circle-one"></div>

<div class="circle circle-two"></div>

<div class="circle circle-three"></div>

<div class="circle circle-four"></div>

</div>


<div class="container min-vh-100 d-flex align-items-center justify-content-center">

<div class="row w-100 justify-content-center">

<div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

<div class="login-card">


<div class="text-center">

<div class="tech-logo">

<i class="bi bi-cpu-fill"></i>

</div>


<h1 class="brand-name">

OutcomeX

</h1>


<p class="subtitle">

~Making Employment Outcomes Count

</p>

</div>


<div class="terminal-header">

<span class="dot red"></span>

<span class="dot yellow"></span>

<span class="dot green"></span>

<span class="terminal-title">

user@techzone:~$ login

</span>

</div>


<form id="loginForm">


<div class="mb-3">

<label for="username" class="form-label">

Username

</label>


<div class="input-group">

<span class="input-group-text">

<i class="bi bi-person-fill"></i>

</span>


<input
type="text"
id="username"
class="form-control"
placeholder="Enter your username"
required
>

</div>

</div>



<div class="mb-3">

<label for="password" class="form-label">

Password

</label>


<div class="input-group">

<span class="input-group-text">

<i class="bi bi-lock-fill"></i>

</span>


<input
type="password"
id="password"
class="form-control"
placeholder="Enter your password"
required
>


<button
type="button"
class="btn password-btn"
id="showPassword"
>

<i class="bi bi-eye-fill"></i>

</button>

</div>

</div>



<div class="d-flex justify-content-between align-items-center mb-4">


<div class="form-check">

<input
class="form-check-input"
type="checkbox"
id="remember"
>

<label
class="form-check-label"
for="remember"
>

Remember me

</label>

</div>


<a href="#" class="tech-link">

Forgot password?

</a>

</div>



<div class="d-grid">

<button
type="submit"
class="btn login-button"
>

<i class="bi bi-box-arrow-in-right me-2"></i>

LOGIN

</button>

</div>


</form>



<div class="divider">

<span>OR</span>

</div>



<div class="row g-2">


<div class="col-6">

<button class="btn social-btn w-100">

<i class="bi bi-github me-1"></i>

GitHub

</button>

</div>


<div class="col-6">

<button class="btn social-btn w-100">

<i class="bi bi-google me-1"></i>

Google

</button>

</div>


</div>



<p class="text-center register-text mt-4 mb-0">

New to TechZone?

<a href="register.html" class="tech-link">

Create account

</a>

</p>



<div class="text-center mt-4">

<small class="footer-text">

<i class="bi bi-shield-lock-fill me-1"></i>

Secure Tech Portal

</small>

</div>


</div>

</div>

</div>

</div>



<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>



<script>

/* =========================
   SHOW / HIDE PASSWORD
   ========================= */

const password = document.getElementById("password");

const showPassword = document.getElementById("showPassword");


showPassword.addEventListener("click", function () {

    if (password.type === "password") {

        password.type = "text";

        this.innerHTML =
        '<i class="bi bi-eye-slash-fill"></i>';

    } else {

        password.type = "password";

        this.innerHTML =
        '<i class="bi bi-eye-fill"></i>';

    }

});



/* =========================
   LOGIN
   ========================= */

const loginForm = document.getElementById("loginForm");


loginForm.addEventListener("submit", async function (event) {

    event.preventDefault();


    const username =
        document.getElementById("username").value.trim();

    const passwordValue =
        document.getElementById("password").value;


    if (!username || !passwordValue) {

        alert("Username and password are required.");

        return;

    }


    try {

        const response = await fetch("/api/login", {

            method: "POST",

            headers: {

                "Content-Type": "application/json"

            },

            credentials: "include",

            body: JSON.stringify({

                username: username,

                password: passwordValue

            })

        });


        const data = await response.json();


        if (response.ok) {

            alert("Login successful.");

            window.location.href = "/dashboard";

        } else {

            alert(data.message || "Invalid username or password.");

        }


    } catch (error) {

        console.error("Login error:", error);

        alert("Unable to connect to the server.");

    }

});

</script>


</body>

</html>
